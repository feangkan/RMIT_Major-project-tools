  - id: idea_b
    title: "Rapid shelter/habitat module — Moon / extreme off-world environment"
    feasibility_15wk: 2
    pr_australia: 1
    nic_bao_fit: 2
    roland_snooks_fit: 3
    anna_johnson_fit: 1
    verdict: parked_spare_plan  # not "drop" — kept deliberately per student request, tracked below
    scope_refined_2026_07: >
      Narrowed per student request from a full settlement masterplan (144-150
      inhabitants, Hassell scale) down to a SINGLE rapid, deployable shelter/
      habitat unit — smaller, more design-focused, more tractable as a design
      problem. Still parked, not the MP capstone, but better-scoped if/when
      pursued later (PhD, practice).
    note: >
      Wrong capstone for the same structural reasons as before: no AU site, no
      real access to test regolith/vacuum/low-gravity behavior, cannot be
      resolved to a buildable level a Melbourne panel can verify in 15 weeks.
      Kept as a deliberately tracked spare/future interest, not discarded.
    status_2026_07: >
      Confirmed as a genuinely current, real trend (not speculative): ispace +
      Shimizu Corporation signed an MOU (April 2026) to jointly develop cislunar
      infrastructure concepts including a lunar surface data centre. Technical
      reality check: thermal management is HARDER on the Moon (no atmosphere for
      convective cooling; regolith proposed as passive thermal buffer), not
      easier — "low gravity = easier" is not accurate as stated.
    precedent_researched:
      - name: "Hassell 'Lunar Habitat Master Plan'"
        official_page: https://www.hassellstudio.com/project/lunar-master-plan-moon-base-for-the-european-space-agency
        lead: "Xavier de Kestelier (Head of Innovation, Hassell)"
        client: "European Space Agency (ESA), for its Discovery programme"
        collaborators: "ESA, Cranfield University, Format Engineers (structural engineering)"
        design_team: "Xavier de Kestelier, Jonathan Irawan, Levent Özruh, Joanna Maria Lesna, Nikos Argyros"
        status: "Unbuilt concept, 2024; full technical report downloadable from official page ('Design of a Scalable Framework of Lunar Habitats')"
        site: "South Lunar Pole, near Shackleton Crater (NOT 'dark side of the moon' — common misconception; site chosen for near-constant polar sunlight + permanently shadowed ice in crater floors)"
        capacity: "144-150 inhabitants at masterplan scale — this spare plan narrows to a single unit"
        method: >
          3D-printed hexapod/tetrapod-shaped interlocking modules (shape borrowed
          from wave-dissipating seawall tetrapods), printed on-site from lunar
          regolith, forming a radiation-shielding shell around inflatable
          living/greenhouse/recreation pods.
        tectonic_note: >
          Repeatable, standardized, interlocking modules — this is philosophically
          the DISCRETE/REPEATABLE camp (Retsin/Claypool, Nic Bao's prefab/modular
          territory), NOT Snooks' intricate/non-repetitive agentBody position.
          If ever pursued academically, this points toward a different
          supervisor lineage than the current Fishermans Bend proposal.
        related_hassell_projects_worth_researching:
          - name: "NASA 3D Printed Habitat Challenge"
            note: "Confirmed Hassell participated directly — was on the 'other precedents to research' list above, now confirmed as their own project, priority to follow up."
          - name: "Orbital Reef space station"
            note: "Hassell-designed commercial low-Earth-orbit space station — adjacent space-architecture precedent, not lunar/regolith-specific but same design team lineage."
          - name: "Hassell x Nagami x to.org — 3D-printed public pavilions from recycled plastic"
            note: >
              GENUINELY RELEVANT BRIDGE: Hassell's own studio has already applied
              swarm/space-project formal logic to a TERRESTRIAL waste-material
              context — 3D-printed public pavilions made from recycled plastic,
              framed as "plastic refuse as an inexhaustible resource for
              construction." Worth researching directly — this is the closest
              thing to a professional-practice precedent connecting the moon
              spare plan (B) and the off-cut/waste material logic already in
              the active Fishermans Bend proposal, without conflating the two.
      - name: "Other single-unit precedents worth researching later"
        note: >
          NASA 3D-Printed Habitat Challenge, ICON 'Project Olympus' (lunar
          regolith 3D printing w/ NASA), AI SpaceFactory 'MARSHA' (Mars habitat,
          single-unit scale) — not yet researched in depth, flagged for later.
      - name: "'Build your own cave' — artificial mass-shell radiation shielding"
        source: "Xavier de Kestelier, WA Museum talk, 17 May 2024 (transcript verified)"
        method: >
          Real lava-tube caves would be ideal radiation shielding (rock mass
          overhead does the job for free) but accessible ones are unconfirmed,
          so Hassell builds an artificial equivalent: uniform tetrapod units
          (regolith-made on-site, shape borrowed from coastal erosion tetrapods)
          thrown/stacked over an inflatable dome formwork until they interlock
          into a self-supporting compression-only shell (dry-stone-wall logic —
          held by friction/interlocking geometry, not fasteners), then the
          inflatable formwork is removed. Needs ~2-3m of regolith mass to
          actually block radiation — deliberately thick/overengineered, which
          is why it tolerates imprecision (removing one tetrapod doesn't
          collapse it, unlike a precision-fitted stone shell alternative).
        precedents_cited_by_dK: >
          Philip Bloch's precision stone shell (rejected — too high-precision);
          Karola Dierichs' Aggregate Pavilion (spiky units, zero-precision
          throw-and-stack); Yui Pavilion, Venice Biennale (salt block, same
          logic); coastal erosion tetrapods (final unit shape chosen).
        open_research_question_for_later: >
          The cave-shell precedent uses ONE uniform tetrapod unit thrown
          without needing to match. Active MP thesis (off-cut metal) asks
          irregular pieces to self-stabilize/connect without matching either
          (see docs/proposal-roland-snooks.md Section 4/9) — same underlying
          problem, different unit logic (uniform-thrown-pile vs irregular-
          agent-negotiated-joint). Worth comparing later: could irregular
          off-cut material be simulated into a similar self-stabilizing
          compression-only mass pile, instead of a uniform tetrapod mold?
        tectonic_note: >
          Inverts the Composite Swarm logic used in the active proposal: here
          the requirement is BULK MASS (2-3m, non-negotiable, radiation
          physics) not structural efficiency (1mm skin/2500mm structure).
          Useful contrast to keep straight — swarm efficiency solves structural
          problems, not shielding/mass problems.
    relationship_to_active_proposal: >
      Does not compete with or replace docs/proposal-roland-snooks.md. Tracked
      separately as a future/PhD/practice-stage interest only.
    shared_root_interest: rapid_deployable_shelter  # see idea_c_spare below

