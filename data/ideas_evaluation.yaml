  - id: idea_b
    title: "Rapid shelter/habitat module — Moon / extreme off-world environment"
    feasibility_15wk: 2
    pr_australia: 1
    nic_bao_fit: 2
    roland_snooks_fit: 3
    anna_johnson_fit: 1
    verdict: parked_spare_plan  # not "drop" — kept deliberately per student request, tracked below
    scope_refined_2026_07: >
      Narrowed per student request from a full settlement masterplan (144-150
      inhabitants, Hassell scale) down to a SINGLE rapid, deployable shelter/
      habitat unit — smaller, more design-focused, more tractable as a design
      problem. Still parked, not the MP capstone, but better-scoped if/when
      pursued later (PhD, practice).
    note: >
      Wrong capstone for the same structural reasons as before: no AU site, no
      real access to test regolith/vacuum/low-gravity behavior, cannot be
      resolved to a buildable level a Melbourne panel can verify in 15 weeks.
      Kept as a deliberately tracked spare/future interest, not discarded.
    status_2026_07: >
      Confirmed as a genuinely current, real trend (not speculative): ispace +
      Shimizu Corporation signed an MOU (April 2026) to jointly develop cislunar
      infrastructure concepts including a lunar surface data centre. Technical
      reality check: thermal management is HARDER on the Moon (no atmosphere for
      convective cooling; regolith proposed as passive thermal buffer), not
      easier — "low gravity = easier" is not accurate as stated.
    precedent_researched:
      - name: "Hassell 'Lunar Habitat Master Plan'"
        lead: "Xavier de Kestelier (Head of Innovation, Hassell)"
        partners: "European Space Agency + Cranfield University"
        year: 2024
        site: "South Lunar Pole, near Shackleton Crater (NOT 'dark side of the moon' — common misconception; site chosen for near-constant polar sunlight + permanently shadowed ice in crater floors)"
        capacity: "144-150 inhabitants at masterplan scale — this spare plan narrows to a single unit"
        method: >
          3D-printed hexapod/tetrapod-shaped interlocking modules (shape borrowed
          from wave-dissipating seawall tetrapods), printed on-site from lunar
          regolith, forming a radiation-shielding shell around inflatable
          living/greenhouse/recreation pods.
        tectonic_note: >
          Repeatable, standardized, interlocking modules — this is philosophically
          the DISCRETE/REPEATABLE camp (Retsin/Claypool, Nic Bao's prefab/modular
          territory), NOT Snooks' intricate/non-repetitive agentBody position.
          If ever pursued academically, this points toward a different
          supervisor lineage than the current Fishermans Bend proposal.
      - name: "Other single-unit precedents worth researching later"
        note: >
          NASA 3D-Printed Habitat Challenge, ICON 'Project Olympus' (lunar
          regolith 3D printing w/ NASA), AI SpaceFactory 'MARSHA' (Mars habitat,
          single-unit scale) — not yet researched in depth, flagged for later.
    relationship_to_active_proposal: >
      Does not compete with or replace docs/proposal-roland-snooks.md. Tracked
      separately as a future/PhD/practice-stage interest only.
    shared_root_interest: rapid_deployable_shelter  # see idea_c_spare below

