categories:
  essential_for_roland_email:
    - author: Roland Snooks
      title: "Behavioral Formation"
      year: 2021
      type: book
      priority: essential
    - author: Roland Snooks
      title: "Behavioral tectonics: agentBody prototypes and the compression of tectonics"
      year: 2022
      doi: "10.1007/s44223-022-00007-8"
      priority: essential
    - author: Kokkugia (Roland Snooks)
      title: "Brass Swarm — Shanghai installation"
      year: 2015
      url: https://www.tectonicformationlab.com/projects/brass-swarm-2015
      priority: essential
      note: >
        agentBody = 4 robotically bent brass rods; empirically-tested bending limits
        encoded into the algorithm for automated generation-to-fabrication workflow.
        Direct precedent for metal + agentBody; uses uniform rod stock — the gap this
        thesis extends is irregular/off-cut stock instead.
    - author: Roland Snooks & Scott Mayson
      title: "RMIT Mace"
      year: 2015
      url: https://www.tectonicformationlab.com/projects/rmit-mace-2015
      priority: essential
      note: >
        ~1 million agents self-organising into an intricate lattice, fabricated by
        direct titanium SLM printing; algorithm tuned to eliminate unprintable
        geometry. Direct precedent for metal + AM + swarm at product scale.
    - author: Kokkugia (Roland Snooks)
      title: "Composite Swarm"
      year: 2014
      url: https://kokkugia.com/Composite-Swarm
      priority: high
      note: >
        Ant-bridge-logic agentBody algorithm compressing surface/structure/ornament
        into one form via fiber-composite + foam components. Conceptual reference for
        agentBody's ant-bridge origin (bodies connecting to bodies to form structure).
    - author: Alisa Andrasek
      title: "Agentic design cognition — RMIT profile & Architecture for Complexity"
      year: 2024
      url: https://www.rmit.edu.au/profiles/a/alisa-andrasek
      priority: essential
      note: Student's studio supervisor — vibe code, swarm, AI
    - author: Alisa Andrasek
      title: "Alien Within Familiar / Wrinkle in Space (Wonderlab, UCL Bartlett)"
      url: https://www.alisaandrasek.com/projects/alien-within-familiar
      url_2: https://www.alisaandrasek.com/projects/wrinkle-in-space
      priority: essential
      note: >
        Cellular division (CD) growth algorithm — architect sets rule-based
        parameters, cells proliferate/differentiate, constrained to a planar
        setting to remain fabricable by robotic extrusion. Direct precedent
        for "growth agent" logic as this thesis' primary formation strategy.
    - author: Alisa Andrasek
      title: "Cloud Pergola (Croatian Pavilion, Venice Biennale 2018)"
      url: https://www.alisaandrasek.com/projects/cloud-pergola
      priority: essential
      note: >
        Multi-agent system (MAS) integrating real site weather data; robotic
        arm trained (NVIDIA Jetson) to track and correct for material
        tolerance errors in real time during 3D-print extrusion. Concrete
        precedent for AI-adaptive fabrication responding to real material
        behavior, not a generic AI-assistance claim.
    - author: Alisa Andrasek
      title: "Endemic Interstices (PROTO/E/CO/LOGICS research, 2011-12)"
      url: https://www.alisaandrasek.com/projects/endemic-interstices
      priority: high
      note: >
        Physics-simulated mud-cracking used as formwork; articulated ground/
        landforms used as scaffolds specifically to avoid material waste.
        Precedent for computation + real material data driving waste
        avoidance, directly relevant to the off-cut metal material framing.
